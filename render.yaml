# Render blueprint: one Docker web service (client + /api). Feed keys are set in the Render dashboard.
services:
  - type: web
    name: surge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: FRED_API_KEY
        sync: false
      - key: NASS_API_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: GTA_API_KEY
        sync: false
      - key: AMS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SURGE_VETTED_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM
        sync: false
      - key: PUBLIC_URL
        sync: false

  # Marketing site (apps/site). Static, no build step: the two maps are generated from the
  # config by apps/site/tools/build-graphics.mjs and committed, and apps/site/test pins the
  # counts it prints to the data they came from. Separate service so the terminal's URL is
  # untouched by anything the site does.
  - type: web
    name: greenfield-site
    runtime: static
    buildCommand: ""
    staticPublishPath: ./apps/site
    pullRequestPreviewsEnabled: false
