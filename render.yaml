# Render blueprint for the SURGE web prototype.
# Option A (below): a static site — simplest, no server, ideal for this stage.
# Option B: a Docker web service using the Dockerfile (uncomment) — use once the
# Plan 2 server adds /api so the same origin serves client + data.
services:
  - type: web
    name: surge-web
    runtime: static
    buildCommand: npm ci && npm run build -w @surge/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

