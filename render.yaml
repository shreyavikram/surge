# Render blueprint: one Docker web service (client + /api). Feed keys are set in the Render dashboard.
services:
  - type: web
    name: surge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: FRED_API_KEY
        sync: false
      - key: NASS_API_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: GTA_API_KEY
        sync: false
      - key: AMS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SURGE_VETTED_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM
        sync: false
      - key: PUBLIC_URL
        sync: false
